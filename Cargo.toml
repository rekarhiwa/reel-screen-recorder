[package]
name = "screen-recorder"
version = "0.3.0"
edition = "2021"
description = "Professional Kurdish screen recorder for Windows"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
windows-capture = "2"
wry = "0.45"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
