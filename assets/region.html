<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent; cursor: crosshair;
      font-family: "Segoe UI", "Noto Naskh Arabic", sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #dim {
      position: absolute; inset: 0;
      background: rgba(8, 6, 18, 0.45);
    }
    #box {
      position: absolute; display: none;
      border: 2px solid #a78bfa;
      box-shadow: 0 0 0 9999px rgba(8, 6, 18, 0.55);
      background: rgba(139, 92, 246, 0.08);
      pointer-events: none;
    }
    #hud {
      position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: 14px;
      background: rgba(18, 14, 32, 0.92);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #f3f0ff; font-size: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      pointer-events: none; white-space: nowrap;
      direction: rtl;
    }
    #hud b { color: #c4b5fd; font-weight: 600; }
    #size {
      position: absolute; display: none;
      padding: 4px 8px; border-radius: 8px;
      background: rgba(18, 14, 32, 0.9);
      color: #e9e4ff; font-size: 12px;
      border: 1px solid rgba(167,139,250,0.3);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="dim"></div>
  <div id="box"></div>
  <div id="size"></div>
  <div id="hud">ناوچەیەک بکێشە · <b>Enter</b> پشتڕاست · <b>Esc</b> هەڵوەشاندنەوە</div>
  <script>
    const box = document.getElementById("box");
    const sizeEl = document.getElementById("size");
    let dragging = false;
    let sx = 0, sy = 0, cx = 0, cy = 0;
    let hasSel = false;

    function send(cmd, data = {}) {
      window.ipc.postMessage(JSON.stringify({ cmd, ...data }));
    }

    function rect() {
      const x = Math.min(sx, cx);
      const y = Math.min(sy, cy);
      const w = Math.abs(cx - sx);
      const h = Math.abs(cy - sy);
      return { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
    }

    function paint() {
      const r = rect();
      if (r.w < 2 || r.h < 2) {
        box.style.display = "none";
        sizeEl.style.display = "none";
        hasSel = false;
        return;
      }
      hasSel = true;
      box.style.display = "block";
      box.style.left = r.x + "px";
      box.style.top = r.y + "px";
      box.style.width = r.w + "px";
      box.style.height = r.h + "px";
      sizeEl.style.display = "block";
      sizeEl.textContent = `${r.w} × ${r.h}`;
      sizeEl.style.left = Math.min(r.x + 8, window.innerWidth - 90) + "px";
      sizeEl.style.top = Math.max(8, r.y - 28) + "px";
    }

    function confirm() {
      const r = rect();
      if (r.w < 32 || r.h < 32) {
        send("region_cancel");
        return;
      }
      send("region_done", {
        region_x: r.x,
        region_y: r.y,
        region_w: r.w,
        region_h: r.h,
      });
    }

    window.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      dragging = true;
      sx = cx = e.clientX;
      sy = cy = e.clientY;
      paint();
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      cx = e.clientX;
      cy = e.clientY;
      paint();
    });
    window.addEventListener("mouseup", (e) => {
      if (!dragging || e.button !== 0) return;
      dragging = false;
      cx = e.clientX;
      cy = e.clientY;
      paint();
      const r = rect();
      if (r.w >= 32 && r.h >= 32) confirm();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        send("region_cancel");
      } else if (e.key === "Enter" && hasSel) {
        confirm();
      }
    });
    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      send("region_cancel");
    });

    send("region_ready");
  </script>
</body>
</html>
