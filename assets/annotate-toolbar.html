<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", sans-serif;
      user-select: none;
    }
    #wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: transparent;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 18px;
      background: rgba(14, 17, 22, 0.92);
      border: 1px solid rgba(243, 239, 230, 0.14);
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      direction: rtl;
    }
    .tool {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: #9aa3af;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .tool svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tool:hover { color: #f3efe6; background: rgba(255,255,255,0.06); }
    .tool.active {
      color: #e09a45;
      background: rgba(224,154,69,0.18);
      box-shadow: inset 0 0 0 1px rgba(224,154,69,0.35);
    }
    .sep { width: 1px; height: 22px; background: rgba(243,239,230,0.12); margin: 0 2px; }
    .swatch {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15); cursor: pointer; padding: 0;
    }
    .swatch.active { border-color: #e09a45; }
    #size { width: 70px; accent-color: #e09a45; }
    #hint {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(14,17,22,0.8);
      color: #f3efe6;
      font-size: 11px;
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
      pointer-events: none;
    }
    #hint.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="hint">قەلەم ئامادەیە</div>
  <div id="wrap">
    <div id="toolbar">
      <button class="tool" data-tool="pointer" title="ماوس" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 3l8 18 2-7 7-2z"/></svg>
      </button>
      <button class="tool active" data-tool="pen" title="قەلەم" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 20l3.2-1 11-11a2 2 0 0 0 0-3l-1.2-1.2a2 2 0 0 0-3 0l-11 11L4 20z"/><path d="M13 6l5 5"/></svg>
      </button>
      <button class="tool" data-tool="high" title="هایلایتەر" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 17l4 3 12-12-3-3L4 17z"/><path d="M14 5l5 5"/></svg>
      </button>
      <div class="sep"></div>
      <button class="tool" data-tool="arrow" title="تیر" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 12h14"/><path d="M14 6l6 6-6 6"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="چوارگۆشە" type="button">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="بازنە" type="button">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
      </button>
      <div class="sep"></div>
      <button class="tool" data-tool="select" title="سێلێکت" type="button">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 2"/></svg>
      </button>
      <button class="tool" data-tool="magic" title="ماجیک" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.4 4.2L18 9l-4.2 1.4L12 15l-1.4-4.6L6 9l4.6-1.8L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
      </button>
      <button class="tool" data-tool="eraser" title="سڕینەوە" type="button">
        <svg viewBox="0 0 24 24"><path d="M5 15l7-7 5 5-7 7H5v-5z"/><path d="M9 19h10"/></svg>
      </button>
      <div class="sep"></div>
      <button class="swatch active" data-color="#ff4d4f" style="background:#ff4d4f" type="button"></button>
      <button class="swatch" data-color="#e09a45" style="background:#e09a45" type="button"></button>
      <button class="swatch" data-color="#4ea57a" style="background:#4ea57a" type="button"></button>
      <button class="swatch" data-color="#3b82f6" style="background:#3b82f6" type="button"></button>
      <button class="swatch" data-color="#f3efe6" style="background:#f3efe6" type="button"></button>
      <input id="size" type="range" min="2" max="28" value="5" />
      <div class="sep"></div>
      <button class="tool" id="undoBtn" title="گەڕانەوە" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 8H4V4"/><path d="M4 8a8 8 0 1 1 2.3 5.7"/></svg>
      </button>
      <button class="tool" id="clearBtn" title="پاککردنەوە" type="button">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M8 7l1 12h6l1-12"/></svg>
      </button>
      <button class="tool" id="hideUi" title="شاردنەوە" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 12s3.5-6 8-6 8 6 8 6-3.5 6-8 6-8-6-8-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>
      <div class="sep"></div>
      <button class="tool" id="pauseBtn" title="پاوس / بەردەوام" type="button">
        <svg id="pauseIcon" viewBox="0 0 24 24"><path d="M8 5v14"/><path d="M16 5v14"/></svg>
      </button>
      <button class="tool" id="stopBtn" title="وەستاندنی تۆمار" type="button" style="color:#ff6574">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>
  <script>
    const hint = document.getElementById("hint");
    function send(cmd, data = {}) {
      window.ipc.postMessage(JSON.stringify({ cmd, ...data }));
    }
    function showHint(msg) {
      hint.textContent = msg;
      hint.classList.add("show");
      clearTimeout(showHint._t);
      showHint._t = setTimeout(() => hint.classList.remove("show"), 1600);
    }
    function applyToolUi(tool) {
      document.querySelectorAll(".tool[data-tool]").forEach((b) => {
        b.classList.toggle("active", b.dataset.tool === tool);
      });
    }
    function setTool(tool, broadcast) {
      const t = tool || "pen";
      applyToolUi(t);
      if (broadcast !== false) send("annotate_cmd", { tool: t });
      if (t === "pointer") showHint("ماوس — کلیک دەگاتە شاشە");
      else if (t === "select" || t === "magic") showHint("سێلێکت — ناوچە هەڵبژێرە");
      else if (t === "pen") showHint("قەلەم ئامادەیە");
    }
    document.querySelectorAll(".tool[data-tool]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        setTool(btn.dataset.tool, true);
      });
    });
    document.querySelectorAll(".swatch").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll(".swatch").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        send("annotate_cmd", { color: btn.dataset.color });
      });
    });
    document.getElementById("size").addEventListener("input", (e) => {
      send("annotate_cmd", { size: Number(e.target.value) || 5 });
    });
    document.getElementById("undoBtn").addEventListener("click", () => send("annotate_cmd", { action: "undo" }));
    document.getElementById("clearBtn").addEventListener("click", () => send("annotate_cmd", { action: "clear" }));
    document.getElementById("hideUi").addEventListener("click", () => {
      setTool("pointer", true);
      send("annotate_cmd", { action: "hide_toolbar" });
      showHint("شاردرا · Ctrl+Shift+D بۆ گەڕانەوە");
    });
    function setPausedUi(paused) {
      const btn = document.getElementById("pauseBtn");
      const icon = document.getElementById("pauseIcon");
      btn.classList.toggle("active", !!paused);
      if (paused) {
        icon.innerHTML = '<path d="M8 5l12 7-12 7z" fill="currentColor" stroke="none"/>';
        btn.title = "بەردەوامبوونەوە";
        showHint("پاوس — کلیک بۆ بەردەوامبوون");
      } else {
        icon.innerHTML = '<path d="M8 5v14"/><path d="M16 5v14"/>';
        btn.title = "پاوس";
      }
    }
    document.getElementById("pauseBtn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      send("toggle_pause");
    });
    document.getElementById("stopBtn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      send("stop");
    });
    window.__toolbarSync = (cfg) => {
      if (cfg && cfg.tool) applyToolUi(String(cfg.tool));
      if (cfg && cfg.paused != null) setPausedUi(!!cfg.paused);
    };
    window.__toolbarUpdate = (cfg) => {
      if (!cfg) return;
      if (cfg.tool) applyToolUi(String(cfg.tool));
      if (cfg.paused != null) setPausedUi(!!cfg.paused);
      if (cfg.showToolbar) {
        const t = cfg.tool ? String(cfg.tool) : "pen";
        setTool(t, true);
        showHint("ئامرازەکان ئامادەن — لە ڤیدیۆدا دەرناکەون");
      }
    };
    send("annotate_toolbar_ready");
    setTool("pen", true);
  </script>
</body>
</html>
