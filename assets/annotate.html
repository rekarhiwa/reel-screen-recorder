<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const state = {
      tool: "pen",
      color: "#ff4d4f",
      size: 5,
      strokes: [],
      draft: null,
      drawing: false,
      dpr: 1,
      dashOffset: 0,
    };

    function send(cmd, data = {}) {
      window.ipc.postMessage(JSON.stringify({ cmd, ...data }));
    }

    function resize() {
      state.dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.max(1, Math.floor(w * state.dpr));
      canvas.height = Math.max(1, Math.floor(h * state.dpr));
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      redraw();
    }

    function setTool(tool) {
      const next = tool || "pen";
      if (state.tool === next) {
        send("annotate_pass", { pass: next === "pointer" });
        return;
      }
      state.tool = next;
      send("annotate_pass", { pass: state.tool === "pointer" });
    }

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function roundRectPath(c, x, y, w, h, rad) {
      const r = Math.min(rad, Math.abs(w) / 2, Math.abs(h) / 2);
      const x2 = x + w, y2 = y + h;
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x2, y, x2, y2, r);
      c.arcTo(x2, y2, x, y2, r);
      c.arcTo(x, y2, x, y, r);
      c.arcTo(x, y, x2, y, r);
      c.closePath();
    }

    function drawArrow(c, x1, y1, x2, y2, width) {
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const head = Math.max(12, width * 3.2);
      c.beginPath();
      c.moveTo(x1, y1);
      c.lineTo(x2, y2);
      c.stroke();
      c.beginPath();
      c.moveTo(x2, y2);
      c.lineTo(x2 - head * Math.cos(ang - 0.4), y2 - head * Math.sin(ang - 0.4));
      c.lineTo(x2 - head * Math.cos(ang + 0.4), y2 - head * Math.sin(ang + 0.4));
      c.closePath();
      c.fill();
    }

    function viewSize() {
      return { w: canvas.width / state.dpr, h: canvas.height / state.dpr };
    }

    function drawStroke(c, s, animDash) {
      if (!s) return;
      c.save();
      if (s.type === "pen" || s.type === "high") {
        c.strokeStyle = s.color;
        c.globalAlpha = s.type === "high" ? 0.35 : 1;
        c.lineWidth = s.size * (s.type === "high" ? 2.4 : 1);
        c.lineCap = "round";
        c.lineJoin = "round";
        c.beginPath();
        s.points.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
        c.stroke();
      } else if (s.type === "arrow") {
        c.strokeStyle = s.color;
        c.fillStyle = s.color;
        c.lineWidth = s.size;
        c.lineCap = "round";
        drawArrow(c, s.x1, s.y1, s.x2, s.y2, s.size);
      } else if (s.type === "rect" || s.type === "ellipse") {
        c.strokeStyle = s.color;
        c.lineWidth = s.size;
        c.lineCap = "round";
        if (s.type === "rect") {
          roundRectPath(c, s.x, s.y, s.w, s.h, 8);
          c.stroke();
        } else {
          c.beginPath();
          c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w / 2), Math.abs(s.h / 2), 0, 0, Math.PI * 2);
          c.stroke();
        }
      } else if (s.type === "select") {
        c.strokeStyle = s.color;
        c.lineWidth = Math.max(2, s.size * 0.7);
        c.setLineDash([8, 6]);
        if (animDash) c.lineDashOffset = -state.dashOffset;
        roundRectPath(c, s.x, s.y, s.w, s.h, 6);
        c.stroke();
        c.setLineDash([]);
      } else if (s.type === "magic") {
        const pad = 14;
        const x = Math.min(s.x, s.x + s.w) - pad;
        const y = Math.min(s.y, s.y + s.h) - pad;
        const w = Math.abs(s.w) + pad * 2;
        const h = Math.abs(s.h) + pad * 2;
        const vs = viewSize();
        c.beginPath();
        c.rect(0, 0, vs.w, vs.h);
        roundRectPath(c, x, y, w, h, 18);
        c.fillStyle = "rgba(0,0,0,0.4)";
        c.fill("evenodd");
        c.fillStyle = s.color + "22";
        roundRectPath(c, x, y, w, h, 18);
        c.fill();
        c.strokeStyle = s.color;
        c.lineWidth = Math.max(3, s.size);
        c.shadowColor = s.color;
        c.shadowBlur = 16;
        c.setLineDash([10, 8]);
        if (animDash) c.lineDashOffset = -state.dashOffset;
        roundRectPath(c, x, y, w, h, 18);
        c.stroke();
        c.setLineDash([]);
        c.shadowBlur = 0;
      } else if (s.type === "eraser") {
        c.globalCompositeOperation = "destination-out";
        c.strokeStyle = "rgba(0,0,0,1)";
        c.lineWidth = s.size * 2.5;
        c.lineCap = "round";
        c.lineJoin = "round";
        c.beginPath();
        s.points.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
        c.stroke();
      }
      c.restore();
    }

    function redraw() {
      const w = canvas.width / state.dpr;
      const h = canvas.height / state.dpr;
      ctx.clearRect(0, 0, w, h);
      state.strokes.filter((s) => s.type !== "magic").forEach((s) => drawStroke(ctx, s, true));
      state.strokes.filter((s) => s.type === "magic").forEach((s) => drawStroke(ctx, s, true));
      if (state.draft) drawStroke(ctx, state.draft, true);
    }

    function startDraft(p) {
      if (state.tool === "pointer") return;
      state.drawing = true;
      const t = state.tool;
      if (t === "pen" || t === "high" || t === "eraser") {
        state.draft = { type: t, color: state.color, size: state.size, points: [p] };
      } else {
        state.draft = { type: t, color: state.color, size: state.size, x: p.x, y: p.y, w: 0, h: 0, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      }
    }

    function updateDraft(p) {
      if (!state.drawing || !state.draft) return;
      const d = state.draft;
      if (d.points) {
        const last = d.points[d.points.length - 1];
        if (Math.hypot(p.x - last.x, p.y - last.y) >= 1.2) d.points.push(p);
      } else {
        d.x2 = p.x; d.y2 = p.y; d.w = p.x - d.x; d.h = p.y - d.y;
      }
      redraw();
    }

    function endDraft() {
      if (!state.drawing) return;
      state.drawing = false;
      if (state.draft) {
        const d = state.draft;
        const ok = d.points
          ? d.points.length > 1
          : (Math.abs(d.w) > 4 || Math.abs(d.h) > 4 || Math.hypot((d.x2 || 0) - (d.x1 || 0), (d.y2 || 0) - (d.y1 || 0)) > 4);
        if (ok) state.strokes.push(d);
        state.draft = null;
        redraw();
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || state.tool === "pointer") return;
      canvas.setPointerCapture(e.pointerId);
      startDraft(pos(e));
    });
    canvas.addEventListener("pointermove", (e) => updateDraft(pos(e)));
    canvas.addEventListener("pointerup", endDraft);
    canvas.addEventListener("pointercancel", endDraft);

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setTool("pointer");
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        state.strokes.pop();
        redraw();
      }
    });

    function tick() {
      state.dashOffset = (state.dashOffset + 0.8) % 36;
      if (state.strokes.some((s) => s.type === "select" || s.type === "magic") ||
          (state.draft && (state.draft.type === "select" || state.draft.type === "magic"))) {
        redraw();
      }
      requestAnimationFrame(tick);
    }

    window.__annotateUpdate = (cfg) => {
      if (cfg.clear) {
        state.strokes = [];
        state.draft = null;
        redraw();
      }
      if (cfg.tool) setTool(cfg.tool);
      if (cfg.color) state.color = String(cfg.color);
      if (cfg.size != null) state.size = Number(cfg.size) || 5;
      if (cfg.action === "undo") { state.strokes.pop(); redraw(); }
      if (cfg.action === "clear") {
        state.strokes = [];
        state.draft = null;
        redraw();
      }
      if (cfg.showToolbar && state.tool === "pointer") setTool("pen");
      else if (cfg.showToolbar) send("annotate_pass", { pass: false });
    };

    window.addEventListener("resize", resize);
    resize();
    tick();
    send("annotate_ready");
    setTool("pen");
  </script>
</body>
</html>
